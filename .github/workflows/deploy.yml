name: Deploy Calificador to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          script_stop: true
          script: |
            echo "🚀 Desplegando Calificador Lumiere en Hostinger..."
            cd ${{ secrets.SSH_TARGET }}
            git remote set-url origin https://${{ secrets.GH_TOKEN }}@github.com/institutolumieresistemas-oss/calificador-Lumiere-Social.git
            git fetch origin main
            git reset --hard origin/main
            mkdir -p uploads mesas
            chmod 777 uploads mesas
            chmod 666 claves.json tabulador.json || true
            echo "✅ Deploy Calificador completado exitosamente con commit $(git rev-parse --short HEAD)"
